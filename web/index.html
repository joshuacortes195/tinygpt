<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A GPT-style language model built from scratch, with its own tokenizer, transformer and training loop. Try it in your browser and look inside while it writes."
    />
    <meta name="theme-color" content="#090d0b" />
    <meta property="og:title" content="TinyGPT" />
    <meta
      property="og:description"
      content="A GPT built from scratch that runs in your browser. See the tokens, the probabilities and the attention."
    />
    <title>TinyGPT: a GPT built from scratch, running in your browser</title>
    <!-- sets the theme before anything paints so there is no flash -->
    <script>
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        // dark is the look the site is built around, light only if it was picked before
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
