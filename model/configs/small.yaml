# about 10M params, first real run on the desktop gpu
name: small
data_dir: data
out_dir: runs/small

model:
  vocab_size: 4096
  block_size: 256
  n_layer: 5
  n_head: 6
  n_embd: 384
  dropout: 0.0

train:
  batch_size: 64
  grad_accum: 1
  max_steps: 25000
  lr: 0.001
  min_lr: 0.0001
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 1000
  eval_batches: 50
  log_interval: 100
  seed: 1337
  compile: false
  device: auto
